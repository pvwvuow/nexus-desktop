<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ORB // Access</title>
    
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@200;300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-void: #030305;
            --glass: rgba(255,255,255,0.025);
            --glass-border: rgba(255,255,255,0.06);
            --glass-highlight: rgba(255,255,255,0.12);
            --text-bright: rgba(255,255,255,0.95);
            --text-dim: rgba(255,255,255,0.4);
            --text-ghost: rgba(255,255,255,0.15);
            --accent: #ec4899;
            --accent-secondary: #a855f7;
            --accent-glow: rgba(236,72,153,0.4);
            --success: #22c55e;
            --danger: #ef4444;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-void);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-bright);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }

       /* ═══════════════════════════════════════════════════════════
   🪟 WINDOW CONTROLS (فقط Electron) - مینیمال و کوچک
   ═══════════════════════════════════════════════════════════ */

.titlebar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 32px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(20px);
    -webkit-app-region: drag;
    z-index: 1000;
    display: none;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.titlebar-title {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
}

.window-controls {
    display: flex;
    gap: 4px;
    -webkit-app-region: no-drag;
}

.window-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    color: rgba(255, 255, 255, 0.5);
    padding: 0;
}

.window-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.9);
}

.window-btn.close:hover {
    background: #ef4444;
    color: white;
}

.window-btn i {
    width: 14px;
    height: 14px;
    stroke-width: 2.5px;
}

        /* ═══════════════════════════════════════════════════════════
           🌌 COSMOS BACKGROUND
           ═══════════════════════════════════════════════════════════ */
        
        .cosmos {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .stars {
            position: absolute;
            inset: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
        }

        .nebula-1 {
            width: 800px;
            height: 800px;
            top: -400px;
            right: -200px;
            background: radial-gradient(circle, #ec4899, transparent 70%);
        }

        .nebula-2 {
            width: 600px;
            height: 600px;
            bottom: -300px;
            left: -150px;
            background: radial-gradient(circle, #a855f7, transparent 70%);
        }

        .film-grain {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* ═══════════════════════════════════════════════════════════
           🌍 ORBIT ANIMATION
           ═══════════════════════════════════════════════════════════ */
        
        .orbit-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(236,72,153,0.1);
            border-radius: 50%;
            animation: rotate 60s linear infinite;
        }

        .orbit-1 {
            width: 400px;
            height: 400px;
            margin: -200px 0 0 -200px;
        }

        .orbit-2 {
            width: 550px;
            height: 550px;
            margin: -275px 0 0 -275px;
            animation-duration: 80s;
            animation-direction: reverse;
        }

        .orbit-3 {
            width: 700px;
            height: 700px;
            margin: -350px 0 0 -350px;
            animation-duration: 100s;
        }

        .planet {
            position: absolute;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(236,72,153,0.6);
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════════════════════════
           🪟 LOGIN CARD - Glass Effect
           ═══════════════════════════════════════════════════════════ */
        
        .glass {
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 
                inset 0 1px 0 var(--glass-highlight), 
                0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Mouse Tracking Light - صورتی-خاکستری ملایم */
        .glass::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(
                circle, 
                rgba(236, 72, 153, 0.08) 0%, 
                rgba(168, 85, 247, 0.05) 30%,
                rgba(200, 120, 200, 0.02) 60%,
                transparent 85%
            );
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease-out;
            transform: translate(-50%, -50%);
            left: var(--mouse-x, 50%);
            top: var(--mouse-y, 50%);
            mix-blend-mode: screen;
            filter: blur(10px);
        }

        .glass.glass-active::before {
            opacity: 1;
        }

        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 36px;
            animation: cardEntry 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 20px;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ═══════════════════════════════════════════════════════════
           🎨 LOGO
           ═══════════════════════════════════════════════════════════ */
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-text {
            font-size: 42px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            letter-spacing: 8px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--text-bright), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-subtitle {
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ═══════════════════════════════════════════════════════════
           📑 TABS
           ═══════════════════════════════════════════════════════════ */
        
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            border: none;
        }

        .tab:hover {
            color: var(--text-bright);
            background: rgba(255,255,255,0.05);
        }

        .tab.active {
            background: rgba(236,72,153,0.2);
            color: var(--text-bright);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* ═══════════════════════════════════════════════════════════
           📝 FORMS
           ═══════════════════════════════════════════════════════════ */
        
        .form-view {
            display: none;
            animation: formFadeIn 0.3s ease-out;
        }

        .form-view.active {
            display: block;
        }

        @keyframes formFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 6px;
            margin-left: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            padding: 12px 14px;
            border-radius: 10px;
            color: var(--text-bright);
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            border-color: var(--accent);
            background: rgba(236,72,153,0.05);
            box-shadow: 0 0 0 3px rgba(236,72,153,0.1);
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.2);
        }

        /* Password Toggle */
        .input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px;
            -webkit-app-region: no-drag;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--text-bright);
        }

        .password-toggle i {
            width: 16px;
            height: 16px;
        }

        /* ═══════════════════════════════════════════════════════════
           🔘 BUTTON
           ═══════════════════════════════════════════════════════════ */
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(236,72,153,0.3);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            -webkit-app-region: no-drag;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(236,72,153,0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ═══════════════════════════════════════════════════════════
           💬 MESSAGE BOX
           ═══════════════════════════════════════════════════════════ */
        
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            animation: messageSlide 0.3s ease-out;
            font-weight: 500;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .message.success {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .message.info {
            background: rgba(236,72,153,0.15);
            color: var(--accent);
            border: 1px solid rgba(236,72,153,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .message i {
            width: 14px;
            height: 14px;
        }

        /* ═══════════════════════════════════════════════════════════
           ⏳ LOADING
           ═══════════════════════════════════════════════════════════ */
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
            display: none;
        }

        .btn.loading {
            pointer-events: none;
        }

        .btn.loading span {
            opacity: 0;
        }

        .btn.loading .spinner {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════════════════════════
           📱 RESPONSIVE
           ═══════════════════════════════════════════════════════════ */
        
        @media (max-width: 480px) {
            .login-card {
                max-width: 90%;
                padding: 28px 20px;
            }

            .logo-text {
                font-size: 36px;
            }

            .orbit-container {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

    <!-- 🪟 Titlebar (فقط Electron) -->
    <div class="titlebar" id="titlebar">
        <div class="titlebar-title">ORB</div>
        <div class="window-controls">
            <button class="window-btn" id="minimizeBtn" title="Minimize">
                <i data-lucide="minus"></i>
            </button>
            <button class="window-btn" id="maximizeBtn" title="Maximize">
                <i data-lucide="square"></i>
            </button>
            <button class="window-btn close" id="closeBtn" title="Close">
                <i data-lucide="x"></i>
            </button>
        </div>
    </div>

    <!-- 🌌 Cosmos Background -->
    <div class="cosmos">
        <div class="stars" id="stars"></div>
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="film-grain"></div>
    </div>

    <!-- 🌍 Orbit Animation -->
    <div class="orbit-container">
        <div class="orbit orbit-1">
            <div class="planet"></div>
        </div>
        <div class="orbit orbit-2">
            <div class="planet"></div>
        </div>
        <div class="orbit orbit-3">
            <div class="planet"></div>
        </div>
    </div>

    <!-- 🪟 Login Card -->
    <div class="login-card glass" id="loginCard">
        <div class="logo">
            <div class="logo-text">ORB</div>
            <div class="logo-subtitle">Access Required</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Sign Up</button>
        </div>

        <div id="messageBox" class="message"></div>

        <!-- Login Form -->
        <div id="loginForm" class="form-view active">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        class="input-field" 
                        placeholder="your@email.com" 
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="loginPass" 
                            class="input-field" 
                            placeholder="••••••••" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPass', this)">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="btn">
                    <span>Enter ORB</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-view">
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input 
                        type="text" 
                        id="regUser" 
                        class="input-field" 
                        placeholder="Choose a username" 
                        autocomplete="username"
                        minlength="3"
                        maxlength="20"
                        required
                    >
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        class="input-field" 
                        placeholder="your@email.com" 
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="regPass" 
                            class="input-field" 
                            placeholder="••••••••" 
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('regPass', this)">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="regBtn" class="btn">
                    <span>Create Account</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // 🔧 CONFIGURATION
        // ═══════════════════════════════════════════════════════════

        const API_URL = 'https://callme.f5f102.site/api';

       // ═══════════════════════════════════════════════════════════
// 🔍 DETECT ENVIRONMENT
// ═══════════════════════════════════════════════════════════

const isElectron = typeof window.electronAPI !== 'undefined';

if (isElectron) {
    console.log('🖥️ Running in Electron');
    
    // نمایش titlebar
    const titlebar = document.getElementById('titlebar');
    titlebar.style.display = 'flex';
    
    // اضافه کردن padding به body برای titlebar
    document.body.style.paddingTop = '32px';
    
    // Window Controls
    const minimizeBtn = document.getElementById('minimizeBtn');
    const maximizeBtn = document.getElementById('maximizeBtn');
    const closeBtn = document.getElementById('closeBtn');
    
    if (minimizeBtn) {
        minimizeBtn.addEventListener('click', () => {
            console.log('🔽 Minimize clicked');
            window.electronAPI.minimizeWindow();
        });
    }
    
    if (maximizeBtn) {
        maximizeBtn.addEventListener('click', () => {
            console.log('🔲 Maximize clicked');
            window.electronAPI.maximizeWindow();
        });
    }
    
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            console.log('❌ Close clicked');
            window.electronAPI.closeWindow();
        });
    }
    
    console.log('✅ Window controls initialized');
} else {
    console.log('🌐 Running in Browser');
}

        // ═══════════════════════════════════════════════════════════
        // 🎨 INITIALIZE LUCIDE ICONS
        // ═══════════════════════════════════════════════════════════

        lucide.createIcons();

        // ═══════════════════════════════════════════════════════════
        // 🌟 STARS ANIMATION
        // ═══════════════════════════════════════════════════════════

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = Math.random() * 3 + 2 + 's';
                container.appendChild(star);
            }
        }

        createStars();

        // ═══════════════════════════════════════════════════════════
        // 🖱️ MOUSE TRACKING GLOW
        // ═══════════════════════════════════════════════════════════

        const loginCard = document.getElementById('loginCard');

        loginCard.addEventListener('mousemove', (e) => {
            const rect = loginCard.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            
            loginCard.style.setProperty('--mouse-x', x + '%');
            loginCard.style.setProperty('--mouse-y', y + '%');
            loginCard.classList.add('glass-active');
        });

        loginCard.addEventListener('mouseleave', () => {
            loginCard.classList.remove('glass-active');
        });

        // ═══════════════════════════════════════════════════════════
        // 🔄 TAB SWITCHING
        // ═══════════════════════════════════════════════════════════

        function switchTab(mode) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.form-view').forEach(f => f.classList.remove('active'));
            document.getElementById(mode + 'Form').classList.add('active');
            hideMessage();
        }

        // ═══════════════════════════════════════════════════════════
        // 💬 MESSAGE HANDLING
        // ═══════════════════════════════════════════════════════════

        function showMessage(type, text) {
            const box = document.getElementById('messageBox');
            box.innerHTML = '';
            
            const icon = document.createElement('i');
            if (type === 'error') icon.setAttribute('data-lucide', 'alert-circle');
            if (type === 'success') icon.setAttribute('data-lucide', 'check-circle');
            if (type === 'info') icon.setAttribute('data-lucide', 'info');
            
            const textNode = document.createTextNode(text);
            
            box.appendChild(icon);
            box.appendChild(textNode);
            box.className = `message ${type}`;
            
            lucide.createIcons();
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.className = 'message';
            box.style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════
        // 👁️ PASSWORD TOGGLE
        // ═══════════════════════════════════════════════════════════

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            
            lucide.createIcons();
        }

        // ═══════════════════════════════════════════════════════════
        // 🔐 LOGIN HANDLER
        // ═══════════════════════════════════════════════════════════

        async function handleLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;

            if (!email || !password) {
                showMessage('error', 'Please fill all fields');
                return;
            }

            if (!/\S+@\S+\.\S+/.test(email)) {
                showMessage('error', 'Please enter a valid email');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;
            hideMessage();
            
            try {
                console.log('🔐 Attempting login...', { email });
                
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                
                console.log('📥 Login response:', res.status, data);

                if (!res.ok) {
                    throw new Error(data.error || data.message || 'Login failed');
                }

                if (data.accessToken) {
                    localStorage.setItem('accessToken', data.accessToken);
                }
                if (data.refreshToken) {
                    localStorage.setItem('refreshToken', data.refreshToken);
                }
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                }

                console.log('✅ Login successful:', data.user?.username || data.user?.email);

                showMessage('success', '✨ Access Granted!');
                
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1000);

            } catch (err) {
                console.error('❌ Login error:', err);
                showMessage('error', err.message || 'Access Denied');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ═══════════════════════════════════════════════════════════
        // ✍️ REGISTER HANDLER
        // ═══════════════════════════════════════════════════════════

        async function handleRegister(e) {
            e.preventDefault();
            
            const btn = document.getElementById('regBtn');
            const username = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value;

            if (!username || !email || !password) {
                showMessage('error', 'Please fill all fields');
                return;
            }

            if (username.length < 3) {
                showMessage('error', 'Username must be at least 3 characters');
                return;
            }

            if (password.length < 6) {
                showMessage('error', 'Password must be at least 6 characters');
                return;
            }

            if (!/\S+@\S+\.\S+/.test(email)) {
                showMessage('error', 'Please enter a valid email');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;
            hideMessage();

            try {
                console.log('📝 Attempting registration...', { username, email });
                
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();
                
                console.log('📥 Register response:', res.status, data);

                if (!res.ok) {
                    throw new Error(data.error || data.message || 'Registration failed');
                }

                if (data.accessToken) {
                    localStorage.setItem('accessToken', data.accessToken);
                }
                if (data.refreshToken) {
                    localStorage.setItem('refreshToken', data.refreshToken);
                }
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                }

                console.log('✅ Registration successful:', data.user?.username || username);

                showMessage('success', '🎉 Account Created!');
                
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1200);

            } catch (err) {
                console.error('❌ Registration error:', err);
                showMessage('error', err.message || 'Creation Failed');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ═══════════════════════════════════════════════════════════
        // 🔍 AUTO-REDIRECT IF LOGGED IN
        // ═══════════════════════════════════════════════════════════

        async function checkExistingSession() {
            const accessToken = localStorage.getItem('accessToken');
            
            if (!accessToken) {
                console.log('ℹ️ No existing session');
                return;
            }

            console.log('🔍 Checking session...');
            showMessage('info', 'Checking session...');

            try {
                const res = await fetch(`${API_URL}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Accept': 'application/json'
                    }
                });

                if (res.ok) {
                    const user = await res.json();
                    console.log('✅ Valid session:', user.username);
                    showMessage('success', 'Session found!');
                    
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 800);
                } else {
                    console.log('⚠️ Session expired');
                    localStorage.clear();
                    hideMessage();
                }
            } catch (error) {
                console.error('❌ Session check failed:', error);
                localStorage.clear();
                hideMessage();
            }
        }

        checkExistingSession();

        console.log('🌌 ORB Login Ready');
        console.log('🔗 API:', API_URL);
        console.log('🖥️ Electron:', isElectron);
    </script>
</body>
